; =============================================================================
; 打印计费助手 PrintPay —— 配置示例（复制成 config.ini 后按自己的情况修改）
; 位置：与 PrintPay.exe 同一个目录（程序会自动生成/更新，也可以在“设置”里改）
; 说明：金额统一以“分”为单位保存（10 分 = 0.10 元），界面按“元”显示。
; =============================================================================

[print]
; 要监控的打印机名（在程序“设置”里选好会自动写到这里）
printerName=
; 队列检查间隔（毫秒）：200~10000，越小越灵敏
pollIntervalMs=800

[billing]
; 每页单价（分）：10 = 0.10 元/页
pricePerPageCents=10
; 最低消费（分）：10 = 0.10 元
minChargeCents=10

[contact]
; 客户加你微信用的微信号（收款弹窗和审批弹窗上会显示）
wechatId=你的微信号（客户加你时用的号）

[policy]
; 其他人（含未登录）打印是否收费
chargeOthers=true
; 管理员（你自己）登录后是否收费：false = 免费
chargeAdmin=false
; 其他人打印前是否需要你同意（会先暂停打印机队列，等你点“同意”）
requireApprovalForOthers=true
; 你自己打印是否需要同意（默认不需要）
requireApprovalForAdmin=false
; 打印完成后自动弹出收款码
autoPaymentDialog=true
; 收款码窗口最大化显示（屏幕大、客户好扫）
fullScreenPayment=false

[ui]
; 点窗口右上角关闭按钮时：true = 最小化到任务栏托盘继续监控（程序常驻后台），false = 直接退出
closeToTray=true
; 启动时是否隐藏主窗口、只留托盘图标。开机自启用这个（false = 启动时显示窗口）
startMinimized=false

[state]
; 运行期状态：打印机当前是否处于“被程序暂停”的状态。
; 程序异常退出后，下次启动会读这个标志并自动恢复打印机，请不要手工改成 true。
pausedByApp=false
